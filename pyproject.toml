[tool.poetry]
name = "pdf-ingestion-pipeline"
version = "0.1.0"
description = "Deterministic extraction and parsing of scientific PDFs into Markdown and LaTeX chunks."
authors = ["Lucas Freitas"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6.0"
pyyaml = "^6.0.1"
click = "^8.1.7"
jinja2 = "^3.1.3"
marker-pdf = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.12.0"
black = "^24.2.0"
ruff = "^0.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
